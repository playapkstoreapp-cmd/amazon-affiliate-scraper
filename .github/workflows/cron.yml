name: Daily Amazon Affiliate Scraper

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'   # <-- Updated to Node 20 to fix global type reference errors

      - name: Install Dependencies
        run: npm install

      - name: Run Scraper Script
        run: node scrape.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Amazon Bot Automation"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase --allow-unrelated-histories || true
          git add jobs.json
          git commit -m "Automated daily product catalog sync with real items" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
