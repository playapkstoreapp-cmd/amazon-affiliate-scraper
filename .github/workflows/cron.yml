name: RSS Product Feed Sync

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC
  workflow_dispatch: # Run anytime manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Run RSS Parser Script
        run: node scrape.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "RSS Feed Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull origin main --rebase --allow-unrelated-histories || true
          git add jobs.json
          git commit -m "Automated RSS feed product sync" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
